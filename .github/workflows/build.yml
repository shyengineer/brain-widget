name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build
        run: gradle :app:assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk brain-widget.apk

      - uses: actions/upload-artifact@v4
        with:
          name: brain-widget-apk
          path: brain-widget.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 브레인 v1.0.${{ github.run_number }}
          body: 휴대폰에서 아래 brain-widget.apk 를 눌러 받은 뒤 설치하세요.
          files: brain-widget.apk
          make_latest: true
